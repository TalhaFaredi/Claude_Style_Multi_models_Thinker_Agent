name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Offline tests (no provider credits, no network)
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:webpack
        env:
          NEXT_PUBLIC_API_URL: https://assistant.example.com
          NEXT_PUBLIC_SITE_URL: https://assistant.example.com

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production images (proves the Dockerfiles and pinned dependencies work together)
        run: |
          docker build -t assistant-backend ./backend
          docker build -t assistant-frontend --build-arg NEXT_PUBLIC_API_URL=https://assistant.example.com --build-arg NEXT_PUBLIC_SITE_URL=https://assistant.example.com ./frontend
      - name: Backend container starts and answers /health
        run: |
          docker run -d --name be -e APP_ENV=production -e PUBLIC_URL=https://assistant.example.com -e ADMIN_EMAILS=ci@example.com -p 8000:8000 assistant-backend
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 3; done
          docker logs be; exit 1
